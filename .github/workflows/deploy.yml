name: Production Deploy (Cloudflare)

# Every push to main runs the full CI (ci.yml) and then deploys only the affected Workers:
#   backend  -> orion-pos-api   (deployed first, verified, health-checked)
#   frontend -> apkabill        (deployed only after the backend succeeded or was not needed)
# Database migrations are never run here: apply them by hand in Neon first (see docs/DEPLOYMENT.md).
# Manual runs stay available and require typing CONFIRM.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Component to deploy to Cloudflare
        required: true
        type: choice
        default: all
        options:
          - all
          - backend
          - frontend
      confirm:
        description: Type "CONFIRM" to authorize deployment
        required: true
        type: string
        default: "NO"

permissions:
  contents: read

# One production deployment at a time; never cancel one midway.
concurrency:
  group: production-cloudflare-deploy
  cancel-in-progress: false

env:
  API_URL: https://orion-pos-api.ayushpalworkplace2006.workers.dev
  WEB_URL: https://apkabill.ayushpalworkplace2006.workers.dev

jobs:
  guard:
    name: Authorize and pick targets
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Decide targets and check credentials
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          TARGET_INPUT: ${{ github.event.inputs.target }}
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
          BEFORE: ${{ github.event.before }}
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            # Fail loudly: a green run without a deploy would look like a successful release.
            echo "::error ::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets are missing. See docs/DEPLOYMENT.md."
            exit 1
          fi
          backend=false; frontend=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$CONFIRM_INPUT" != "CONFIRM" ]; then
              echo "::error ::Deployment rejected. Type CONFIRM to run a manual deployment."
              exit 1
            fi
            [ "$TARGET_INPUT" = all ] || [ "$TARGET_INPUT" = backend ] && backend=true
            [ "$TARGET_INPUT" = all ] || [ "$TARGET_INPUT" = frontend ] && frontend=true
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            backend=true; frontend=true   # new branch or force-push: deploy both
          else
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            echo "$changed" | grep -qE '^(backend/|package\.json|package-lock\.json|\.github/workflows/)' && backend=true
            # frontend/android only affects the APK, not the web Worker.
            echo "$changed" | grep -E '^(frontend/|package\.json|package-lock\.json|\.github/workflows/)' | grep -qv '^frontend/android/' && frontend=true
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "### Targets: backend=$backend frontend=$frontend" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  deploy-backend:
    name: Deploy backend (orion-pos-api)
    needs: [guard, checks]
    if: needs.guard.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ env.API_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record current (rollback) version
        id: prev
        working-directory: backend
        run: echo "version=$(npx wrangler deployments status --name orion-pos-api --json | jq -r '.versions[0].version_id')" >> "$GITHUB_OUTPUT"
      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy --name orion-pos-api --message "ci ${{ github.sha }}"
      - name: Verify deployed commit
        id: verify
        working-directory: backend
        run: |
          status=$(npx wrangler deployments status --name orion-pos-api --json)
          msg=$(echo "$status" | jq -r '.annotations["workers/message"]')
          ver=$(echo "$status" | jq -r '.versions[0].version_id')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          [ "$msg" = "ci $GITHUB_SHA" ] || { echo "::error ::Active deployment is '$msg', expected 'ci $GITHUB_SHA'"; exit 1; }
      - name: Health check (/health and /health/db)
        run: |
          for path in /health /health/db; do
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$API_URL$path" || true)
              [ "$code" = 200 ] && break
              sleep 10
            done
            echo "$path -> $code"
            [ "$code" = 200 ] || { echo "::error ::$API_URL$path returned $code"; exit 1; }
          done
      - name: Summary
        if: always()
        env:
          PREV: ${{ steps.prev.outputs.version }}
          NEW: ${{ steps.verify.outputs.version }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### orion-pos-api: $OUTCOME"
            echo "| commit | version | previous version | URL |"
            echo "|---|---|---|---|"
            echo "| \`$GITHUB_SHA\` | \`${NEW:-n/a}\` | \`${PREV:-n/a}\` | $API_URL |"
            [ "$OUTCOME" = success ] || echo "Roll back: \`cd backend && npx wrangler rollback $PREV --name orion-pos-api -m 'rollback ci'\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: Deploy frontend (apkabill)
    needs: [guard, checks, deploy-backend]
    # Frontend never goes out ahead of a failed backend deploy.
    if: ${{ always() && needs.checks.result == 'success' && needs.guard.outputs.frontend == 'true' && (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ env.WEB_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record current (rollback) version
        id: prev
        working-directory: backend
        run: echo "version=$(npx wrangler deployments status --name apkabill --json | jq -r '.versions[0].version_id')" >> "$GITHUB_OUTPUT"
      - name: Build
        run: npm run build:frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          # The build writes .wrangler/deploy/config.json -> dist/server/wrangler.json (ASSETS binding,
          # nodejs_compat). --name keeps the existing Worker; the generated name would create a new one.
          command: deploy --name apkabill --message "ci ${{ github.sha }}"
      - name: Verify deployed commit
        id: verify
        working-directory: backend
        run: |
          status=$(npx wrangler deployments status --name apkabill --json)
          msg=$(echo "$status" | jq -r '.annotations["workers/message"]')
          echo "version=$(echo "$status" | jq -r '.versions[0].version_id')" >> "$GITHUB_OUTPUT"
          [ "$msg" = "ci $GITHUB_SHA" ] || { echo "::error ::Active deployment is '$msg', expected 'ci $GITHUB_SHA'"; exit 1; }
      - name: Health check (/ and /login)
        run: |
          for path in / /login; do
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$WEB_URL$path" || true)
              [ "$code" = 200 ] && break
              sleep 10
            done
            echo "$path -> $code"
            [ "$code" = 200 ] || { echo "::error ::$WEB_URL$path returned $code"; exit 1; }
          done
      - name: Summary
        if: always()
        env:
          PREV: ${{ steps.prev.outputs.version }}
          NEW: ${{ steps.verify.outputs.version }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### apkabill: $OUTCOME"
            echo "| commit | version | previous version | URL |"
            echo "|---|---|---|---|"
            echo "| \`$GITHUB_SHA\` | \`${NEW:-n/a}\` | \`${PREV:-n/a}\` | $WEB_URL |"
            [ "$OUTCOME" = success ] || echo "Roll back: \`cd backend && npx wrangler rollback $PREV --name apkabill -m 'rollback ci'\`"
          } >> "$GITHUB_STEP_SUMMARY"
