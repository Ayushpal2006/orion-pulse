name: Production Manual Deploy (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Component to deploy to Cloudflare'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - backend
          - frontend
      confirm:
        description: 'Type "CONFIRM" to authorize deployment'
        required: true
        type: string
        default: 'NO'

# Ensure only one deployment runs at a time to prevent state corruption
concurrency:
  group: production-cloudflare-deploy
  cancel-in-progress: false

jobs:
  guard:
    name: Deployment Authorization Guard
    runs-on: ubuntu-latest
    steps:
      - name: Validate Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "CONFIRM" ]; then
            echo "::error ::Deployment rejected! You must explicitly type 'CONFIRM' to trigger production deployment."
            exit 1
          fi
          echo "Deployment authorization confirmed for target: ${{ github.event.inputs.target }}"

  build-and-test:
    name: Pre-Flight Verification
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: npm ci

      - name: Backend Build Check
        run: npm run build:backend

      - name: Financial Amount Scale Matrix Test
        run: node scripts/verify-amount-scale-fix.mjs

      - name: Backend Unit Tests
        run: |
          cd backend
          bun test src/tests/worker-jwt-env.test.ts

      - name: Frontend Build Check
        run: npm run build:frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  deploy-backend:
    name: Deploy Backend Worker (orion-pos-api)
    needs: [guard, build-and-test]
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'backend' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://orion-pos-api.ayushpalworkplace2006.workers.dev
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Backend Bundle
        run: npm run build:backend

      - name: Deploy Backend to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy --name orion-pos-api

  deploy-frontend:
    name: Deploy Frontend Worker (apkabill)
    needs: [guard, build-and-test]
    if: ${{ github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://apkabill.ayushpalworkplace2006.workers.dev
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Frontend SSR Bundle
        run: npm run build:frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Deploy Frontend to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name apkabill dist/server/index.mjs --compatibility-date 2026-03-01 --compatibility-flags nodejs_compat --assets dist/public
          workingDirectory: frontend
