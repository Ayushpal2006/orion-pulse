name: CI

# Required checks for every pull request and branch push. deploy.yml calls this same workflow
# (workflow_call) before any production deploy, so main is gated by exactly these checks.
on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Superseded PR/branch runs are cancelled; runs that gate a production deploy are not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan (new commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: false
      # Scans only the commits in this push/PR. Old history has known exposures documented in
      # security/EXPOSURE-REPORT-2026-11-26.md (outside the repo); those need a history purge, not CI.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  backend:
    name: Backend (typecheck, tests, DB auth tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/orion
      TZ: UTC
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: npm ci
      - name: Backend build and typecheck
        run: npm run build:backend
      - name: Amount scale matrix (paise/rupee regression)
        run: node scripts/verify-amount-scale-fix.mjs
      - name: Backend unit tests (JWT, admin guard, CORS)
        working-directory: backend
        run: bun test src/tests/worker-jwt-env.test.ts src/tests/auth-jwt-secret.test.ts src/tests/admin-routes-guard.test.ts src/tests/cors-allowlist.test.ts
      - name: Load test schema (schema only, no data)
        working-directory: backend
        run: |
          psql -v ON_ERROR_STOP=1 -q "$DATABASE_URL" -f src/tests/fixtures/ci-schema.sql > /dev/null
          psql -v ON_ERROR_STOP=1 -q "$DATABASE_URL" -f src/tests/fixtures/ci-seed.sql > /dev/null
      - name: Login regression matrix (production mode)
        working-directory: backend
        run: bun src/tests/test-login-matrix.ts
      - name: No login backdoor in production
        working-directory: backend
        run: bun src/tests/test-login-backdoor.ts

  frontend:
    name: Frontend (typecheck, tests, production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p .
      - name: Unit tests (share, UPI, print toggles, offline payload)
        working-directory: frontend
        run: bun test src
      - name: Production build
        run: npm run build:frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  lint:
    name: Lint (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # shortcut: 769 pre-existing ESLint errors (2026-11-27), so lint reports but does not block.
    # Make it required once `npx eslint src` in frontend/ is clean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npx eslint src --max-warnings=-1 > eslint.txt 2>&1 || { tail -5 eslint.txt; tail -5 eslint.txt >> "$GITHUB_STEP_SUMMARY"; exit 1; }
